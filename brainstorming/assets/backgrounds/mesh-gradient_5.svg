<svg xmlns="http://www.w3.org/2000/svg" id="mesh-gradient" 
	    width="1000" height="500" viewBox="0 0 1000 500" >
	        <defs>
	            <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
	                <feGaussianBlur stdDeviation="105" />
	            </filter>
	            <filter id="noise" x="0" y="0" width="100%" height="100%">
				<feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
				<feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
			</filter>
	        </defs>
	        <rect id="background" width="100%" height="100%" fill="#F9F7F7" />
	        <g id="swatches" width="1000" height="500" filter="url(#blur)"><rect x="-117.38587282621657" y="-3.3592303622940562" width="451.5670640712681" height="348.6098170043744" fill="#3F72AF" /><rect x="693.9643856948438" y="-205.0887134260496" width="542.6827383468817" height="432.68173971869635" fill="#3F72AF" /><rect x="-258.5081709939508" y="154.25128335468568" width="518.276011611282" height="325.15568712896226" fill="#3F72AF" /></g>
	    	<rect x="0" y="0" width="1000" height="500" 
	    	style="mix-blend-mode: overlay; filter: url(#noise); opacity: 17%"></rect>
    	</svg>